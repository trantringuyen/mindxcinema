<!DOCTYPE html>

<html class="dark" lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>Đăng ký | MINDX CINEMA</title><script src="https://cdn.tailwindcss.com?plugins=forms"></script><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#111318;color:#e2e2e9}.serif{font-family:'Playfair Display',serif}</style></head><body class="min-h-screen flex items-center justify-center p-5"><main class="w-full max-w-md bg-[#1a1b21] border border-[#4f4538]/60 rounded-2xl p-8 shadow-2xl"><a class="text-[#f4c377] font-bold tracking-widest" href="index.html">MINDX CINEMA</a><p class="text-xs uppercase tracking-[.25em] text-[#d6a85f] mt-8">Join the cinema society</p><h1 class="serif text-4xl mt-2">Tạo tài khoản</h1><p class="text-sm text-gray-400 mt-2 mb-7">Tạo tài khoản để lưu phim yêu thích và tiếp tục hành trình điện ảnh.</p><form class="space-y-4" id="register-form"><label class="block text-sm">Họ và tên<input class="mt-2 w-full rounded-lg bg-[#0c0e13] border border-[#4f4538] p-3" name="name" placeholder="Nguyễn Văn A" required=""/></label><label class="block text-sm">Email<input class="mt-2 w-full rounded-lg bg-[#0c0e13] border border-[#4f4538] p-3" name="email" placeholder="you@example.com" required="" type="email"/></label><label class="block text-sm">Mật khẩu<input class="mt-2 w-full rounded-lg bg-[#0c0e13] border border-[#4f4538] p-3" minlength="8" name="password" placeholder="Ít nhất 8 ký tự" required="" type="password"/></label><label class="block text-sm">Xác nhận mật khẩu<input class="mt-2 w-full rounded-lg bg-[#0c0e13] border border-[#4f4538] p-3" minlength="8" name="confirm" placeholder="Nhập lại mật khẩu" required="" type="password"/></label><label class="flex gap-2 text-xs text-gray-400"><input class="mt-0.5 accent-[#d6a85f]" required="" type="checkbox"/> Tôi đồng ý với điều khoản sử dụng và chính sách bảo mật.</label><p class="text-sm" id="register-message" role="status"></p><button class="w-full rounded-full bg-[#d6a85f] text-[#111318] font-bold py-3 hover:bg-[#f4c377]">Tạo tài khoản</button></form><p class="text-sm text-center text-gray-400 mt-6">Đã có tài khoản? <a class="text-[#f4c377]" href="login.html">Đăng nhập</a></p><a class="block text-center text-xs text-gray-500 mt-6" href="index.html">← Quay về trang chủ</a></main><script>document.getElementById('register-form').addEventListener('submit',e=>{e.preventDefault();const f=e.currentTarget;if(f.password.value!==f.confirm.value){document.getElementById('register-message').textContent='Mật khẩu xác nhận chưa khớp.';return;}document.getElementById('register-message').textContent='Giao diện đăng ký đã được kiểm tra. Cần kết nối backend để tạo tài khoản thật.';});</script><script src="js/site-navigation.js"></script></body></html>
